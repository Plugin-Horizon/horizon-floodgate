[package]
name = "mod-floodgate"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# The form JSON and the Global API's answers.
serde_json = "1"
# The Global API (Global Linking, gamertag/XUID lookups), as Horizon's other crates use it.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Own linking's database (Floodgate's SQLite implementation); Horizon's mod deps carry it as feature `sqlite`.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }

