# horizon-floodgate: the backend part of Floodgate as a Horizon native mod (horizon-mixins bundle).
# The handshake, pre-login, profile, payload and tick injections need Horizon's hooks-all branch
# (fce1fb23d, not merged upstream yet). Only long-host still names an internal engine function.

[mod]
id = "floodgate"
version = "0.1.0"
priority = 0

[compatibility]
horizon_revision = "69fab597a6f0e8a6ce524d38d1b73e599e343034"

# `lan` (the connection code) is compiled in horizon-client-lib.
[[crate]]
id = "core"
path = "core"
dependent = "horizon-client"

# The crate's API for the engine's other crates (the game's hooks): `horizon_client::floodgate::...`.
[[module]]
id = "api"
file = "crates/horizon-client/src/client_lib.rs"
name = "floodgate"
source = "helpers/api.rs"
visibility = "pub"

# Each connection's handshake (hooks-all handshake): the Floodgate data is decrypted and taken out of
# the host; wrong data is refused with Floodgate's message.
[[injection]]
id = "handshake"
kind = "HEAD"
target = "horizon_client::lan::conn::native_handshake"
helper = "helpers/handshake.rs"
bindings = [
  { name = "host", ty = "&mut String", value = "host" },
  { name = "intent", ty = "i32", value = "intent" },
  { name = "cancel", ty = "&mut bool", value = "cancel" },
  { name = "reason", ty = "&mut Option<horizon_client_core::text::Text>", value = "reason" },
]

# Without forwarding (Geyser straight to this server) the handshake host is limited to 255 characters
# (vanilla); Floodgate data needs more. hooks-all reads 32767 only with forwarding on, so this stays. Only the
# handshake host is read with the limit 255, and it is read with 32767 instead, as Paper does
# behind a proxy.
[[injection]]
id = "long-host"
kind = "HEAD"
cancellable = true
target = "horizon_protocol::buf::Reader<'_>::string"
helper = "helpers/long_host.rs"
bindings = [
  { name = "reader", ty = "&mut crate::buf::Reader<'_>", value = "&mut *self" },
  { name = "limit", ty = "usize", value = "max" },
]

# Global Linking and require-link, on the connection's thread before the server's checks (hooks-all
# player_pre_login).
[[injection]]
id = "pre-login"
kind = "HEAD"
target = "horizon_client::lan::conn::native_player_pre_login"
helper = "helpers/pre_login.rs"
bindings = [
  { name = "defer", ty = "&mut Vec<std::sync::mpsc::Receiver<Result<(), horizon_client_core::text::Text>>>", value = "defer" },
]

# Admitted: the Bedrock player becomes a Floodgate player (hooks-all player_profile).
[[injection]]
id = "profile"
kind = "HEAD"
target = "horizon_client::lan::conn::native_player_profile"
helper = "helpers/profile.rs"
bindings = [{ name = "player", ty = "u128", value = "player" }]

# A player who leaves is no longer a Floodgate player (stable hook point).
[[injection]]
id = "logged-out"
hook = "player_logged_out"
hook_version = 1
kind = "HEAD"
helper = "helpers/logged_out.rs"
bindings = [{ name = "player", ty = "u128", value = "player" }]

# A player's payload on a floodgate: channel: form answers, skins Geyser uploaded (hooks-all
# custom_payload_from_client).
[[injection]]
id = "payload"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_custom_payload_from_client"
helper = "helpers/payload.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# Twice a tick: `minecraft:register` for new players, queued forms, transfers and packets out
# (send_custom_payload_to_player), uploaded skins shown (set_profile_property, refresh_player),
# and the kicks the channels asked for.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "helpers/tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# /floodgate, /linkaccount, /unlinkaccount (stable hook points).
[[injection]]
id = "register"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "helpers/register.rs"
bindings = [{ name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "commands" }]

[[injection]]
id = "perform"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "helpers/perform.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
